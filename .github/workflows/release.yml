# Release workflow: publishes a release when a version tag is pushed.
#
# Author: kevin-mcm <kevincardenasmiranda9@gmail.com>
# Date:   2026-10-08

name: Release

# Pushing a tag like v0.2.0 publishes a GitHub Release with the packages that
# package.yml builds (Conan bundles for every target, cppi-run, SHA256SUMS),
# and uploads the Conan package to the team's Conan remote if one is
# configured. Games such as cppi-farm download the bundles from the release;
# see docs/ci-cd.md.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  version:
    name: Check version
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - id: read
        run: |
          python -m pip install "conan>=2.4,<3"
          version=$(conan inspect . --format=json | python -c "import json,sys; print(json.load(sys.stdin)['version'])")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match project version $version (CMakeLists.txt)"
            exit 1
          fi

  package:
    name: Package
    needs: version
    uses: ./.github/workflows/package.yml

  github-release:
    name: GitHub Release
    needs: [version, package]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: cppi-${{ needs.version.outputs.version }}
          path: dist
      # The release text is the version's CHANGELOG.md section, when it has one.
      - name: Release notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          [[ -s notes.md ]] || echo "No CHANGELOG.md section for $VERSION." > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          body_path: notes.md
          generate_release_notes: true
          prerelease: ${{ startsWith(needs.version.outputs.version, '0.') }}
          fail_on_unmatched_files: true

  conan-upload:
    name: Upload to the Conan remote
    needs: [version, package]
    runs-on: ubuntu-24.04
    env:
      CONAN_REMOTE_URL: ${{ secrets.CONAN_REMOTE_URL }}
      CONAN_LOGIN_USERNAME: ${{ secrets.CONAN_LOGIN_USERNAME }}
      CONAN_PASSWORD: ${{ secrets.CONAN_PASSWORD }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check the remote
        id: remote
        run: |
          if [[ -z "$CONAN_REMOTE_URL" ]]; then
            echo "::notice::CONAN_REMOTE_URL is not set; skipping the upload (see docs/ci-cd.md)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v7
        if: steps.remote.outputs.configured == 'true'
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        if: steps.remote.outputs.configured == 'true'
        with:
          name: cppi-${{ needs.version.outputs.version }}
          path: dist
      - name: Upload recipe and binaries
        if: steps.remote.outputs.configured == 'true'
        run: |
          python -m pip install "conan>=2.4,<3"
          conan profile detect --force
          conan cache restore "dist/cppi-$VERSION-conan-all.tgz"
          conan remote add cppi-remote "$CONAN_REMOTE_URL" --force
          conan remote login cppi-remote "$CONAN_LOGIN_USERNAME" -p "$CONAN_PASSWORD"
          conan upload "cppi/$VERSION:*" -r cppi-remote --confirm
