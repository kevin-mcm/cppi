name: Setup Conan
description: Install Conan 2, detect the default profile and restore the package cache.

inputs:
  cache-key:
    description: Distinguishes caches between jobs (compiler, build type, target...).
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install Conan
      shell: bash
      run: |
        python -m pip install --upgrade "conan>=2.4,<3"
        conan profile detect --force
        conan --version

    - name: Restore Conan package cache
      uses: actions/cache@v4
      with:
        path: ~/.conan2/p
        key: conan-${{ runner.os }}-${{ inputs.cache-key }}-${{ hashFiles('conanfile.py', 'conan/profiles/**') }}
        restore-keys: |
          conan-${{ runner.os }}-${{ inputs.cache-key }}-
